site_name: Synapse Manual
site_url: https://m00zu.github.io/Synapse/
site_description: Documentation for Synapse — Visual Node-Based Data Analysis
repo_url: https://github.com/m00zu/Synapse
repo_name: m00zu/Synapse
theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
  icon:
    logo: material/brain
    repo: fontawesome/brands/github

use_directory_urls: false
site_dir: synapse/site

plugins: []

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Interface Overview: getting-started/interface.md
